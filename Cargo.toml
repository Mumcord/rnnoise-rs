[package]
name = "rnnoise-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "BSD-3-Clause"
description = "Idiomatic Rust port of Xiph RNNoise (current conv+GRU model) for real-time speech noise suppression"
repository = "https://github.com/lovelace-labs/rnnoise-rs"
readme = "README.md"
keywords = ["rnnoise", "denoise", "noise", "audio", "dsp"]
categories = ["multimedia::audio", "science"]
exclude = ["bup", "scripts"]
homepage = "https://github.com/lovelace-labs/rnnoise-rs"
documentation = "https://docs.rs/rnnoise-rs"
authors = ["lovelace-labs"]
[lib]
name = "rnnoise"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = []
# Expose a C ABI matching rnnoise.h (DenoiseState / rnnoise_process_frame ...).
capi = []
# Also bundle the original (2018) RNNoise model: a smaller, faster, lower-quality
# pipeline exposed as `DenoiseStateV1` (adds ~85 KB of embedded weights). Uses
# `realfft` (rustfft) for the front-end FFT — the same fast FFT `nnnoiseless`
# uses — so the legacy model is faster than `nnnoiseless`.
legacy-model = ["dep:realfft"]

[dependencies]
realfft = { version = "3", optional = true }

[dev-dependencies]

[[bin]]
name = "rnnoise-demo"
path = "src/bin/rnnoise_demo.rs"

[[bench]]
name = "process"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Style gates from doc/styleguide.md. `pedantic` is deliberately not enabled as a
# whole (rule C9: the DSP casts and the deliberately-near f32 constants are the
# arithmetic); the guide-mapped lints are enabled individually.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unstable_features = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic = "deny"
must_use_candidate = "deny"
exhaustive_enums = "deny"
exhaustive_structs = "deny"
wildcard_imports = "deny"
disallowed_methods = "deny"
# Module names mirror upstream C files (rule C2), so `simd::scalar` etc. are fine.
module_name_repetitions = "allow"
